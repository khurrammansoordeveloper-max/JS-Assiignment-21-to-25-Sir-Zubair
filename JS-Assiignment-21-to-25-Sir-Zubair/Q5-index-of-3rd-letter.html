<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Index of 3rd Letter Pakistani </title>
</head>
<body>
    <h1> Index of 3rd Letter </h1>


    <script>
// The word to search in
var word = "Pakistani";
// Find the index of the 3rd letter (which is "k")
var index = word.indexOf("k");
document.write("The index of the 3rd letter 'k' in the word '" + word + "' is: " + index);


    </script>
</body>
</html>
