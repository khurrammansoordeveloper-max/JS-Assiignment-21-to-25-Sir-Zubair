<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Index of Letter L in Hello world </title>
</head>
<body>
     <h1> Index of Letter L in Hello world </h1>

     <script>


var word = "Hello world";

var index = word.indexOf("l");
document.write("The index of the letter 'l' in the word '" + word + "' is: " + index);

     </script>
</body>
</html>
