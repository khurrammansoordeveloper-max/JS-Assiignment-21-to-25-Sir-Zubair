<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Validation</title>
</head>
<body>
  <h2>Enter Password</h2>
  
  <input type="text" id="password" placeholder="Type your password">
  <button onclick="validatePassword()">Submit</button>
  
  <p id="result"></p>

  <script>
    function validatePassword() {
      let password = document.getElementById("password").value;
      let isValid = true;
      let message = "";


      if (password.length < 6) {
        isValid = false;
        message = "Password must be at least 6 characters long.";
      }

      
      else if (password.charCodeAt(0) >= 48 && password.charCodeAt(0) <= 57) {
        isValid = false;
        message = "Password cannot begin with a number.";
      }

     
      else {
        let hasAlphabet = false;
        let hasNumber = false;

        for (let i = 0; i < password.length; i++) {
          let code = password.charCodeAt(i);

          if ((code >= 65 && code <= 90) || (code >= 97 && code <= 122)) {
            hasAlphabet = true;
          }

        
          if (code >= 48 && code <= 57) {
            hasNumber = true;
          }
        }

        if (!hasAlphabet || !hasNumber) {
          isValid = false;
          message = "Password must contain both alphabets and numbers.";
        }
      }

    
      if (isValid) {
        document.getElementById("result").textContent = "Valid Password: " + password;
      } else {
        alert("Entered password: " + password + "\n" + message + "\nPlease enter a valid password.");
      }
    }
  </script>
</body>
</html>
